<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWork - Frilanserlik va Zakozlar Platformasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #090a0f;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navigatsiya -->
    <header class="glass-card sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">💼 MiniWork</span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-300 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">👤 sobirjon <span class="text-cyan-400">(+998200072116)</span></span>
                <a href="#" class="text-sm text-red-400 hover:text-red-300 transition">Chiqish</a>
            </div>
        </div>
    </header>

    <!-- Asosiy Qism -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- Yon Menyu (Sidebar) -->
        <div class="glass-card p-5 rounded-2xl h-fit space-y-3">
            <a href="#" class="block px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-lg shadow-indigo-500/20 transition">🛒 Xaridor Kabineti</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl hover:bg-gray-800 text-gray-300 transition">📋 Mavjud Loyihalar</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl hover:bg-gray-800 text-gray-300 transition">⚡ Zakoz yaratish</a>
        </div>

        <!-- Asosiy Kontent Maydoni -->
        <div class="md:col-span-3 space-y-6">
            <div class="glass-card p-6 rounded-2xl border border-gray-800 shadow-2xl">
                <h1 class="text-2xl font-bold text-white mb-2">Xush kelibsiz, Sobirjon!</h1>
                <p class="text-gray-400 text-sm">Bu yerda siz yangi zakozlar yaratishingiz, mavjud loyihalarni boshqarishingiz mumkin.</p>
            </div>

            <!-- Tezkor Forma / Zakoz yaratish namunasi -->
            <div class="glass-card p-6 rounded-2xl border border-gray-800">
                <h2 class="text-lg font-semibold text-white mb-4">Yangi Zakoz Qo'shish</h2>
                <form class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Loyiha nomi</label>
                        <input type="text" placeholder="Masalan: Telegram bot yaratish" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Tavsif va talablar</label>
                        <textarea rows="3" placeholder="Loyiha haqida qisqacha..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Byudjet ($)</label>
                        <input type="number" placeholder="100" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/25 hover:opacity-95 transition">Zakoz yaratish</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        MiniWork Platformasi &copy; 2026. Barcha huquqlar himoyalangan.
    </footer>

</body>
</html>
